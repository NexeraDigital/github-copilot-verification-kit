<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Content Security Policy - blocks all external resources -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
    <title>Electron Copilot Validation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e8e8e8;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00d4ff;
        }
        .status-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .status-card h2 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 10px;
        }
        .status-value {
            font-size: 18px;
            color: #fff;
        }
        .status-success {
            color: #4ade80;
        }
        .status-pending {
            color: #fbbf24;
        }
        .status-error {
            color: #f87171;
        }
        .version-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        .version-item {
            text-align: center;
            padding: 15px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 8px;
        }
        .version-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }
        .version-value {
            font-size: 16px;
            font-weight: 600;
            color: #00d4ff;
        }
        #offline-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fbbf24;
            animation: pulse 2s infinite;
        }
        .indicator.success {
            background: #4ade80;
            animation: none;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Electron Copilot Validation</h1>

        <div class="status-card">
            <h2>Offline Verification</h2>
            <div id="offline-status">
                <div class="indicator" id="offline-indicator"></div>
                <span class="status-value status-pending" id="offline-text">Checking...</span>
            </div>
        </div>

        <div class="status-card">
            <h2>Health Check</h2>
            <div id="health-status" class="status-value status-pending">Checking...</div>
        </div>

        <div class="status-card">
            <h2>App Information</h2>
            <div id="app-info" class="status-value">Loading...</div>
        </div>

        <div class="status-card">
            <h2>Versions</h2>
            <div class="version-grid">
                <div class="version-item">
                    <div class="version-label">Electron</div>
                    <div class="version-value" id="electron-version">-</div>
                </div>
                <div class="version-item">
                    <div class="version-label">Chrome</div>
                    <div class="version-value" id="chrome-version">-</div>
                </div>
                <div class="version-item">
                    <div class="version-label">Node</div>
                    <div class="version-value" id="node-version">-</div>
                </div>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
