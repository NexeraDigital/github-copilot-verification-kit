<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Content Security Policy - blocks all external resources -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
    <title>Electron Copilot Validation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e8e8e8;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00d4ff;
        }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        .status-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .status-card.full-width {
            grid-column: span 2;
        }
        .status-card h2 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 10px;
        }
        .status-value {
            font-size: 18px;
            color: #fff;
        }
        .status-success {
            color: #4ade80;
        }
        .status-pending {
            color: #fbbf24;
        }
        .status-error {
            color: #f87171;
        }
        .version-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        .version-item {
            text-align: center;
            padding: 15px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 8px;
        }
        .version-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }
        .version-value {
            font-size: 16px;
            font-weight: 600;
            color: #00d4ff;
        }
        .copilot-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .copilot-section h2 {
            color: #00d4ff;
            margin-bottom: 15px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .input-group input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 14px;
        }
        .input-group input::placeholder {
            color: #666;
        }
        .input-group input:focus {
            outline: none;
            border-color: #00d4ff;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #00d4ff;
            color: #1a1a2e;
        }
        .btn-primary:hover:not(:disabled) {
            background: #00b8e6;
        }
        .btn-primary:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
        .test-results {
            margin-top: 15px;
        }
        .step-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            margin-bottom: 8px;
        }
        .step-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .step-icon.success {
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
        }
        .step-icon.error {
            background: rgba(248, 113, 113, 0.2);
            color: #f87171;
        }
        .step-icon.pending {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
        }
        .step-content {
            flex: 1;
        }
        .step-name {
            font-weight: 600;
            font-size: 14px;
        }
        .step-message {
            font-size: 12px;
            color: #888;
            margin-top: 2px;
            word-break: break-all;
        }
        .final-result {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            font-weight: 600;
        }
        .final-result.success {
            background: rgba(74, 222, 128, 0.15);
            border: 1px solid rgba(74, 222, 128, 0.3);
            color: #4ade80;
        }
        .final-result.error {
            background: rgba(248, 113, 113, 0.15);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: #f87171;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner {
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Electron Copilot Validation</h1>

        <div class="status-grid">
            <div class="status-card">
                <h2>Health Check</h2>
                <div id="health-status" class="status-value status-pending">Checking...</div>
            </div>

            <div class="status-card">
                <h2>Versions</h2>
                <div class="version-grid">
                    <div class="version-item">
                        <div class="version-label">Electron</div>
                        <div class="version-value" id="electron-version">-</div>
                    </div>
                    <div class="version-item">
                        <div class="version-label">Chrome</div>
                        <div class="version-value" id="chrome-version">-</div>
                    </div>
                    <div class="version-item">
                        <div class="version-label">Node</div>
                        <div class="version-value" id="node-version">-</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="copilot-section">
            <h2>Copilot SDK Integration Test</h2>
            <p style="color: #888; margin-bottom: 15px; font-size: 14px;">
                Tests that the Copilot SDK can communicate with the GitHub Copilot API.
                Requires network access and GitHub Copilot authentication.
            </p>
            <div class="input-group">
                <input type="text" id="copilot-prompt" placeholder="Enter a test prompt (default: Say hello in exactly 3 words.)">
                <button class="btn btn-primary" id="run-copilot-test">Run Test</button>
            </div>
            <div id="test-results" class="test-results"></div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
